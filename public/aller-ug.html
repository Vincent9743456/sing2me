<!doctype html>
<!--
  RELAIS D'OUVERTURE (b320) — pourquoi cette page existe :

  Ouvrir directement https://www.ultimate-guitar.com/… depuis l'app déclenche
  le LIEN UNIVERSEL d'iOS/Android : le téléphone ouvre l'application UG
  installée, où la sélection/copie de la partition est impossible (constat de
  Vincent). Une navigation initiée PAR SCRIPT depuis une page de NOTRE
  domaine, elle, n'est pas traitée comme « un lien tapé vers UG » : le
  navigateur reste le navigateur, et le copier-coller redevient possible.

  Aucune requête vers UG ne part d'ici : c'est une simple redirection du
  navigateur de l'utilisateur (même posture que le nouvel onglet, b319).
-->
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>mojosong</title>
  <style>
    html, body { background: #0a0f1d; color: #f4f0e9; margin: 0;
      font-family: system-ui, sans-serif; }
    .c { display: flex; align-items: center; justify-content: center;
      min-height: 100vh; text-align: center; padding: 24px; }
  </style>
</head>
<body>
  <div class="c"><p>Ouverture de la recherche…</p></div>
  <script>
    (function () {
      var q = new URLSearchParams(location.search).get('q') || '';
      var url = 'https://www.ultimate-guitar.com/search.php?search_type=title&value='
        + encodeURIComponent(q);
      // replace() : la page relais ne reste pas dans l'historique — le
      // bouton retour du navigateur ramène directement à mojosong.
      location.replace(url);
    })();
  </script>
</body>
</html>
