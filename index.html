<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0f1d" />
    <!-- L'application et toutes ses pages publiques (artiste, session, liens
         de partage) ne sont pas indexées. Seule la landing /site/ l'est. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="DodoSongs — le compagnon des musiciens, des groupes et de leurs concerts."
    />
    <title>DodoSongs</title>
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <!-- iOS ignore les SVG : icône d'accueil en PNG (Ajouter à l'écran d'accueil) -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Application web installée (plein écran, sans barre du navigateur) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DodoSongs" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
